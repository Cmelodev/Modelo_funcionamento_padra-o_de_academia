<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0d">
<title>Power Fit — Alunos</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="alunos">

<div id="sidebar-root"></div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="app-main">
  <div id="topbar-root"></div>
  <main class="content">
<section class="page" id="page-alunos">
      <div class="page-head">
        <div>
          <h1>Alunos</h1>
          <p>Cadastro, planos, status e histórico dos alunos</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-orange" onclick="toast('Exportação de alunos gerada em CSV.','orange')">
            <svg class="i"><use href="#i-download"/></svg> Exportar
          </button>
          <button class="btn btn-green" onclick="abrirAlunoModal()">
            <svg class="i"><use href="#i-plus"/></svg> Novo aluno
          </button>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="search-inline">
            <svg class="i"><use href="#i-search"/></svg>
            <input id="alunoSearch" placeholder="Buscar por nome, e-mail ou matrícula" oninput="renderAlunos()">
          </div>
          <select class="select" id="alunoStatus" onchange="renderAlunos()">
            <option value="Todos">Todos os status</option>
            <option value="Ativo">Ativos</option>
            <option value="Inadimplente">Inadimplentes</option>
            <option value="Inativo">Inativos</option>
          </select>
          <select class="select" id="alunoPlano" onchange="renderAlunos()">
            <option value="Todos">Todos os planos</option>
            <option value="Mensal">Mensal</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Semestral">Semestral</option>
            <option value="Anual">Anual</option>
          </select>
          <div class="grow"></div>
          <span class="muted" id="alunoCount" style="font-size:11px">8 resultados</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Aluno</th>
                <th>Matrícula</th>
                <th>Plano</th>
                <th>Status</th>
                <th>Último pagamento</th>
                <th>Professor</th>
                <th style="text-align:right">Ações</th>
              </tr>
            </thead>
            <tbody id="alunosBody"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <span>Mostrando <b id="alunoCount2">8</b> de 132 alunos</span>
          <div class="pagination">
            <button class="page-btn">‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">›</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ================= MODAL: ALUNO ================= -->
<div class="modal" id="modal-aluno">
  <div class="modal-backdrop" onclick="closeModal('modal-aluno')"></div>
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h3 id="modal-aluno-title">Novo aluno</h3>
        <p>Preencha os dados do cadastro</p>
      </div>
      <button class="icon-btn" onclick="closeModal('modal-aluno')" aria-label="Fechar">
        <svg class="i"><use href="#i-x"/></svg>
      </button>
    </div>
    <form onsubmit="salvarAluno(event)">
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full">
            <label>Nome completo *</label>
            <input class="input" id="al-nome" placeholder="Ex.: Ana Beatriz Souza" required>
          </div>
          <div class="field">
            <label>E-mail *</label>
            <input class="input" id="al-email" type="email" placeholder="ana@email.com" required>
          </div>
          <div class="field">
            <label>Telefone</label>
            <input class="input" id="al-tel" placeholder="(11) 90000-0000">
          </div>
          <div class="field">
            <label>Plano *</label>
            <select class="input" id="al-plano" required>
              <option>Mensal</option>
              <option>Trimestral</option>
              <option>Semestral</option>
              <option>Anual</option>
            </select>
          </div>
          <div class="field">
            <label>Status</label>
            <select class="input" id="al-status">
              <option>Ativo</option>
              <option>Inadimplente</option>
              <option>Inativo</option>
            </select>
          </div>
          <div class="field full">
            <label>Professor responsável</label>
            <select class="input" id="al-prof">
              <option>Rafael Souza</option>
              <option>Amanda Lima</option>
              <option>Bruno Carvalho</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modal-aluno')">Cancelar</button>
        <button type="submit" class="btn btn-green">
          <svg class="i"><use href="#i-check"/></svg> Salvar aluno
        </button>
      </div>
    </form>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script src="js/alunos.js"></script>
</body>
</html>
